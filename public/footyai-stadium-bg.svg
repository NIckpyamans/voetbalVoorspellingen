<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">FootyAI stadion achtergrond</title>
  <desc id="desc">Donker voetbalstadion met veldperspectief, stadionlichten en zwevende turquoise analysepanelen.</desc>
  <defs>
    <radialGradient id="skyGlow" cx="50%" cy="18%" r="72%">
      <stop offset="0%" stop-color="#15324a"/>
      <stop offset="42%" stop-color="#081522"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="pitch" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#20482e"/>
      <stop offset="50%" stop-color="#15371f"/>
      <stop offset="100%" stop-color="#08150c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity=".28"/>
      <stop offset="55%" stop-color="#14b8a6" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity=".06"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="lightBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>

