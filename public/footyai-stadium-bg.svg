<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">FootyAI stadion met analysepanelen</title>
  <desc id="desc">Een donker stadion met groen veld en zwevende turquoise AI analysepanelen als achtergrond voor FootyAI.</desc>
  <defs>
    <radialGradient id="night" cx="50%" cy="15%" r="82%">
      <stop offset="0%" stop-color="#132f45"/>
      <stop offset="36%" stop-color="#0a1a2a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="pitch" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#377a42"/>
      <stop offset="44%" stop-color="#1f5b2b"/>
      <stop offset="100%" stop-color="#0b2311"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity=".34"/>
      <stop offset="55%" stop-color="#2dd4bf" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity=".08"/>
    </linearGradient>
    <filter id="panelGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="lampGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1600" height="1100" fill="url(#night)"/>
  <path d="M0 454 C254 340 478 316 800 318 C1122 316 1346 340 1600 454 L1600 690 C1210 585 1002 548 800 548 C598 548 390 585 0 690 Z" fill="#050b14"/>
  <path d="M0 616 C325 500 592 470 800 470 C1008 470 1275 500 1600 616 L1600 1100 L0 1100 Z" fill="url(#pitch)"/>
  <path d="M0 686 C340 565 590 530 800 530 C1010 530 1260 565 1600 686" fill="none" stroke="#99f6e4" stroke-opacity=".12" stroke-width="3"/>
  <path d="M800 528 L800 1100" stroke="#e0f2fe" stroke-opacity=".52" stroke-width="5"/>
  <path d="M298 1100 L666 528 M1302 1100 L934 528" stroke="#e0f2fe" stroke-opacity=".42" stroke-width="4"/>
  <path d="M504 886 L1096 886 L986 650 L614 650 Z" fill="none" stroke="#e0f2fe" stroke-opacity=".36" stroke-width="4"/>
  <path d="M608 1100 L992 1100 L948 886 L652 886 Z" fill="none" stroke="#e0f2fe" stroke-opacity=".28" stroke-width="4"/>
  <ellipse cx="800" cy="672" rx="124" ry="36" fill="none" stroke="#e0f2fe" stroke-opacity=".26" stroke-width="4"/>

  <g filter="url(#lampGlow)">
    <circle cx="128" cy="360" r="66" fill="#dbeafe" opacity=".8"/>
    <circle cx="266" cy="334" r="42" fill="#fff" opacity=".7"/>
    <circle cx="478" cy="318" r="46" fill="#e0f2fe" opacity=".64"/>
    <circle cx="1122" cy="318" r="46" fill="#e0f2fe" opacity=".64"/>
    <circle cx="1334" cy="334" r="42" fill="#fff" opacity=".7"/>
    <circle cx="1472" cy="360" r="66" fill="#dbeafe" opacity=".8"/>
  </g>
  <g opacity=".36">
    <path d="M128 360 L432 1010" stroke="#bfdbfe" stroke-width="48" stroke-linecap="round" opacity=".11"/>
    <path d="M1472 360 L1168 1010" stroke="#bfdbfe" stroke-width="48" stroke-linecap="round" opacity=".11"/>
    <path d="M478 318 L665 880" stroke="#67e8f9" stroke-width="28" stroke-linecap="round" opacity=".09"/>
    <path d="M1122 318 L935 880" stroke="#67e8f9" stroke-width="28" stroke-linecap="round" opacity=".09"/>
  </g>

  <g filter="url(#panelGlow)" font-family="Plus Jakarta Sans, Arial, sans-serif">
    <g transform="translate(596 300)">
      <rect width="408" height="228" rx="18" fill="url(#panel)" stroke="#5eead4" stroke-opacity=".8"/>
      <rect y="0" width="408" height="48" rx="18" fill="#0f766e" opacity=".28"/>
      <text x="204" y="31" text-anchor="middle" fill="#ccfbf1" font-size="15" font-weight="900" letter-spacing="2">MATCH PREDICTION AI</text>
      <path d="M38 146 C84 91 124 142 166 108 C216 67 256 170 308 110 C344 68 372 96 396 76" fill="none" stroke="#67e8f9" stroke-width="5"/>
      <path d="M38 176 C92 142 130 174 182 150 C232 128 278 188 336 154 C362 140 382 144 398 130" fill="none" stroke="#bbf7d0" stroke-width="3" opacity=".75"/>
      <circle cx="70" cy="92" r="24" fill="none" stroke="#67e8f9" stroke-width="4"/>
      <text x="314" y="198" fill="#e0f2fe" font-size="17" font-weight="800">2-1</text>
    </g>

    <g transform="translate(146 382) rotate(-4)">
      <rect width="380" height="220" rx="18" fill="url(#panel)" stroke="#5eead4" stroke-opacity=".7"/>
      <text x="190" y="34" text-anchor="middle" fill="#ccfbf1" font-size="14" font-weight="900" letter-spacing="2">FORM & H2H</text>
      <path d="M42 148 C90 92 126 172 174 124 C214 84 250 128 318 72" fill="none" stroke="#67e8f9" stroke-width="4"/>
      <path d="M44 184 L336 184 M44 128 L336 128 M44 76 L336 76" stroke="#99f6e4" stroke-opacity=".2"/>
      <circle cx="298" cy="110" r="24" fill="none" stroke="#5eead4" stroke-width="3"/>
    </g>

    <g transform="translate(1074 360) rotate(4)">
      <rect width="390" height="216" rx="18" fill="url(#panel)" stroke="#5eead4" stroke-opacity=".72"/>
      <text x="195" y="34" text-anchor="middle" fill="#ccfbf1" font-size="14" font-weight="900" letter-spacing="2">DATA FOOTBALL PREDICTION</text>
      <g fill="#d1fae5" font-size="13" font-weight="700">
        <text x="34" y="78">ClubElo edge</text><text x="300" y="78">+18</text>
        <text x="34" y="112">H2H balance</text><text x="300" y="112">0.34</text>
        <text x="34" y="146">Market signal</text><text x="300" y="146">Strong</text>
        <text x="34" y="180">Exact score</text><text x="300" y="180">41%</text>
      </g>
    </g>

    <g transform="translate(162 650) rotate(-3)">
      <rect width="390" height="176" rx="16" fill="url(#panel)" stroke="#5eead4" stroke-opacity=".55"/>
      <text x="28" y="34" fill="#ccfbf1" font-size="15" font-weight="900">TEAM MOMENTUM</text>
      <path d="M34 126 C90 84 126 132 180 104 C224 80 270 108 342 60" fill="none" stroke="#67e8f9" stroke-width="4"/>
    </g>

    <g transform="translate(1034 660) rotate(3)">
      <rect width="400" height="190" rx="16" fill="url(#panel)" stroke="#5eead4" stroke-opacity=".56"/>
      <text x="28" y="34" fill="#ccfbf1" font-size="15" font-weight="900">AI REVIEW</text>
      <path d="M36 78 L354 78 M36 118 L354 118 M36 158 L354 158" stroke="#99f6e4" stroke-opacity=".22"/>
      <path d="M48 152 C98 112 142 132 192 90 C236 54 278 78 350 50" fill="none" stroke="#bbf7d0" stroke-width="3"/>
    </g>
  </g>

  <g opacity=".36">
    <circle cx="708" cy="772" r="12" fill="#f8fafc"/>
    <circle cx="888" cy="748" r="12" fill="#f8fafc"/>
    <circle cx="1012" cy="824" r="11" fill="#f8fafc"/>
    <path d="M708 786 L700 842 M888 762 L880 812 M1012 838 L1004 888" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
