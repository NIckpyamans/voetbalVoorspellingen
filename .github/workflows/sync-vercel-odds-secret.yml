name: Sync odds secret to Vercel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_PROVIDER_NAME_2: ${{ secrets.ODDS_PROVIDER_NAME_2 }}
      ODDS_API_URL_TEMPLATE_2: ${{ secrets.ODDS_API_URL_TEMPLATE_2 }}
      ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
      ODDS_PROVIDER_NAME_3: ${{ secrets.ODDS_PROVIDER_NAME_3 }}
      ODDS_API_URL_TEMPLATE_3: ${{ secrets.ODDS_API_URL_TEMPLATE_3 }}
      ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
      SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
      MYSPORTS_API_KEY: ${{ secrets.MYSPORTS_API_KEY }}
      SPORTMONKS_ODDS_API_URL_TEMPLATE: ${{ secrets.SPORTMONKS_ODDS_API_URL_TEMPLATE }}
      API_KEY_API_FOOTBALL: ${{ secrets.API_KEY_API_FOOTBALL }}
      API_FOOTBALL_BASE_URL: ${{ vars.API_FOOTBALL_BASE_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_PREFIX: ${{ secrets.CLOUDFLARE_R2_PREFIX }}
      VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ secrets.VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: nickpyamans-projects
      VERCEL_ORG_ID: team_77TfTeW6AFxfRZoNALN9k9zL
      VERCEL_PROJECT_ID: prj_hc35cqK3Dvw4u15tiOVwfJ0jo3Au
      VERCEL_PROJECT_NAME: voetbalvoorspellingen-clean
    steps:
      - uses: actions/checkout@v5
      - name: Validate required secrets
        run: |
          test -n "$ODDS_API_KEY" || (echo "ODDS_API_KEY ontbreekt" && exit 1)
          test -n "$VERCEL_TOKEN" || (echo "VERCEL_TOKEN ontbreekt. Maak in Vercel een token met toegang tot $VERCEL_SCOPE en zet die als GitHub secret VERCEL_TOKEN." && exit 1)
      - name: Validate Vercel token access
        if: env.VERCEL_TOKEN != ''
        run: |
          npx vercel@54.15.0 whoami --token "$VERCEL_TOKEN" >/tmp/vercel-whoami.txt || {
            echo "VERCEL_TOKEN is ongeldig of ingetrokken. Maak een nieuwe token in Vercel en update GitHub secret VERCEL_TOKEN."
            exit 1
          }
          if ! npx vercel@54.15.0 teams ls --token "$VERCEL_TOKEN" | grep -q "$VERCEL_SCOPE"; then
            echo "VERCEL_TOKEN heeft geen toegang tot Vercel scope/team '$VERCEL_SCOPE'."
            echo "Maak een token onder het juiste account/team of geef deze token toegang tot $VERCEL_SCOPE."
            exit 1
          fi
      - name: Link Vercel project by ids
        if: env.VERCEL_TOKEN != ''
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {"projectId":"$VERCEL_PROJECT_ID","orgId":"$VERCEL_ORG_ID","projectName":"$VERCEL_PROJECT_NAME"}
          EOF
      - name: Add ODDS_API_KEY to all Vercel environments
        if: env.VERCEL_TOKEN != ''
        run: |
          printf '%s' "$ODDS_API_KEY" | npx vercel@54.15.0 env add ODDS_API_KEY production --force --sensitive --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          printf '%s' "$ODDS_API_KEY" | npx vercel@54.15.0 env add ODDS_API_KEY preview "" --force --sensitive --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          printf '%s' "$ODDS_API_KEY" | npx vercel@54.15.0 env add ODDS_API_KEY development --force --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
      - name: Add API-Football base URL to all Vercel environments
        if: env.VERCEL_TOKEN != '' && env.API_FOOTBALL_BASE_URL != ''
        run: |
          printf '%s' "$API_FOOTBALL_BASE_URL" | npx vercel@54.15.0 env add API_FOOTBALL_BASE_URL production --force --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          printf '%s' "$API_FOOTBALL_BASE_URL" | npx vercel@54.15.0 env add API_FOOTBALL_BASE_URL preview "" --force --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          printf '%s' "$API_FOOTBALL_BASE_URL" | npx vercel@54.15.0 env add API_FOOTBALL_BASE_URL development --force --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
      - name: Add API-Football key to all Vercel environments
        if: env.VERCEL_TOKEN != '' && env.API_KEY_API_FOOTBALL != ''
        run: |
          printf '%s' "$API_KEY_API_FOOTBALL" | npx vercel@54.15.0 env add API_KEY_API_FOOTBALL production --force --sensitive --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          printf '%s' "$API_KEY_API_FOOTBALL" | npx vercel@54.15.0 env add API_KEY_API_FOOTBALL preview "" --force --sensitive --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          printf '%s' "$API_KEY_API_FOOTBALL" | npx vercel@54.15.0 env add API_KEY_API_FOOTBALL development --force --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
      - name: Add optional secondary odds provider settings to Vercel
        if: env.VERCEL_TOKEN != ''
        run: |
          add_env() {
            name="$1"
            value="$2"
            sensitive="$3"
            [ -n "$value" ] || return 0
            if [ "$sensitive" = "true" ]; then
              printf '%s' "$value" | npx vercel@54.15.0 env add "$name" production --force --sensitive --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
              printf '%s' "$value" | npx vercel@54.15.0 env add "$name" preview "" --force --sensitive --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
            else
              printf '%s' "$value" | npx vercel@54.15.0 env add "$name" production --force --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
              printf '%s' "$value" | npx vercel@54.15.0 env add "$name" preview "" --force --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
            fi
            printf '%s' "$value" | npx vercel@54.15.0 env add "$name" development --force --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          }
          add_env ODDS_PROVIDER_NAME_2 "$ODDS_PROVIDER_NAME_2" false
          add_env ODDS_API_URL_TEMPLATE_2 "$ODDS_API_URL_TEMPLATE_2" false
          add_env ODDS_API_KEY_2 "$ODDS_API_KEY_2" true
          add_env ODDS_PROVIDER_NAME_3 "$ODDS_PROVIDER_NAME_3" false
          add_env ODDS_API_URL_TEMPLATE_3 "$ODDS_API_URL_TEMPLATE_3" false
          add_env ODDS_API_KEY_3 "$ODDS_API_KEY_3" true
          add_env SPORTMONKS_API_KEY "${SPORTMONKS_API_KEY:-$MYSPORTS_API_KEY}" true
          add_env MYSPORTS_API_KEY "$MYSPORTS_API_KEY" true
          add_env SPORTMONKS_ODDS_API_URL_TEMPLATE "$SPORTMONKS_ODDS_API_URL_TEMPLATE" false
          add_env CLOUDFLARE_R2_ACCOUNT_ID "$CLOUDFLARE_R2_ACCOUNT_ID" true
          add_env CLOUDFLARE_R2_ACCESS_KEY_ID "$CLOUDFLARE_R2_ACCESS_KEY_ID" true
          add_env CLOUDFLARE_R2_SECRET_ACCESS_KEY "$CLOUDFLARE_R2_SECRET_ACCESS_KEY" true
          add_env CLOUDFLARE_R2_BUCKET "$CLOUDFLARE_R2_BUCKET" true
          add_env CLOUDFLARE_R2_PREFIX "$CLOUDFLARE_R2_PREFIX" false
          add_env DASHBOARD_R2_CACHE_ENABLED "true" false
          add_env VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN "$VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN" false
