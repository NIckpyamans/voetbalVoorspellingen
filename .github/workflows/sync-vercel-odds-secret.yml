name: Sync odds secret to Vercel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_PROVIDER_NAME_2: ${{ secrets.ODDS_PROVIDER_NAME_2 }}
      ODDS_API_URL_TEMPLATE_2: ${{ secrets.ODDS_API_URL_TEMPLATE_2 }}
      ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
      ODDS_PROVIDER_NAME_3: ${{ secrets.ODDS_PROVIDER_NAME_3 }}
      ODDS_API_URL_TEMPLATE_3: ${{ secrets.ODDS_API_URL_TEMPLATE_3 }}
      ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
      SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
      MYSPORTS_API_KEY: ${{ secrets.MYSPORTS_API_KEY }}
      SPORTMONKS_ODDS_API_URL_TEMPLATE: ${{ secrets.SPORTMONKS_ODDS_API_URL_TEMPLATE }}
      API_KEY_API_FOOTBALL: ${{ secrets.API_KEY_API_FOOTBALL }}
      API_FOOTBALL_BASE_URL: ${{ vars.API_FOOTBALL_BASE_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Validate required secrets
        run: |
          test -n "$ODDS_API_KEY" || (echo "ODDS_API_KEY ontbreekt" && exit 1)
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN ontbreekt; Vercel-sync wordt overgeslagen zonder workflow failure."
          fi
      - name: Link Vercel project
        if: env.VERCEL_TOKEN != ''
        run: npx vercel@54.15.0 link --yes --project voetbalvoorspellingen-clean --scope nickpyamans-projects --token "$VERCEL_TOKEN"
      - name: Add ODDS_API_KEY to all Vercel environments
        if: env.VERCEL_TOKEN != ''
        run: |
          printf '%s' "$ODDS_API_KEY" | npx vercel@54.15.0 env add ODDS_API_KEY production --force --sensitive --yes --token "$VERCEL_TOKEN"
          printf '%s' "$ODDS_API_KEY" | npx vercel@54.15.0 env add ODDS_API_KEY preview "" --force --sensitive --yes --token "$VERCEL_TOKEN"
          printf '%s' "$ODDS_API_KEY" | npx vercel@54.15.0 env add ODDS_API_KEY development --force --yes --token "$VERCEL_TOKEN"
      - name: Add API-Football base URL to all Vercel environments
        if: env.VERCEL_TOKEN != '' && env.API_FOOTBALL_BASE_URL != ''
        run: |
          printf '%s' "$API_FOOTBALL_BASE_URL" | npx vercel@54.15.0 env add API_FOOTBALL_BASE_URL production --force --yes --token "$VERCEL_TOKEN"
          printf '%s' "$API_FOOTBALL_BASE_URL" | npx vercel@54.15.0 env add API_FOOTBALL_BASE_URL preview "" --force --yes --token "$VERCEL_TOKEN"
          printf '%s' "$API_FOOTBALL_BASE_URL" | npx vercel@54.15.0 env add API_FOOTBALL_BASE_URL development --force --yes --token "$VERCEL_TOKEN"
      - name: Add API-Football key to all Vercel environments
        if: env.VERCEL_TOKEN != '' && env.API_KEY_API_FOOTBALL != ''
        run: |
          printf '%s' "$API_KEY_API_FOOTBALL" | npx vercel@54.15.0 env add API_KEY_API_FOOTBALL production --force --sensitive --yes --token "$VERCEL_TOKEN"
          printf '%s' "$API_KEY_API_FOOTBALL" | npx vercel@54.15.0 env add API_KEY_API_FOOTBALL preview "" --force --sensitive --yes --token "$VERCEL_TOKEN"
          printf '%s' "$API_KEY_API_FOOTBALL" | npx vercel@54.15.0 env add API_KEY_API_FOOTBALL development --force --yes --token "$VERCEL_TOKEN"
      - name: Add optional secondary odds provider settings to Vercel
        if: env.VERCEL_TOKEN != ''
        run: |
          add_env() {
            name="$1"
            value="$2"
            sensitive="$3"
            [ -n "$value" ] || return 0
            if [ "$sensitive" = "true" ]; then
              printf '%s' "$value" | npx vercel@54.15.0 env add "$name" production --force --sensitive --yes --token "$VERCEL_TOKEN"
              printf '%s' "$value" | npx vercel@54.15.0 env add "$name" preview "" --force --sensitive --yes --token "$VERCEL_TOKEN"
            else
              printf '%s' "$value" | npx vercel@54.15.0 env add "$name" production --force --yes --token "$VERCEL_TOKEN"
              printf '%s' "$value" | npx vercel@54.15.0 env add "$name" preview "" --force --yes --token "$VERCEL_TOKEN"
            fi
            printf '%s' "$value" | npx vercel@54.15.0 env add "$name" development --force --yes --token "$VERCEL_TOKEN"
          }
          add_env ODDS_PROVIDER_NAME_2 "$ODDS_PROVIDER_NAME_2" false
          add_env ODDS_API_URL_TEMPLATE_2 "$ODDS_API_URL_TEMPLATE_2" false
          add_env ODDS_API_KEY_2 "$ODDS_API_KEY_2" true
          add_env ODDS_PROVIDER_NAME_3 "$ODDS_PROVIDER_NAME_3" false
          add_env ODDS_API_URL_TEMPLATE_3 "$ODDS_API_URL_TEMPLATE_3" false
          add_env ODDS_API_KEY_3 "$ODDS_API_KEY_3" true
          add_env SPORTMONKS_API_KEY "${SPORTMONKS_API_KEY:-$MYSPORTS_API_KEY}" true
          add_env MYSPORTS_API_KEY "$MYSPORTS_API_KEY" true
          add_env SPORTMONKS_ODDS_API_URL_TEMPLATE "$SPORTMONKS_ODDS_API_URL_TEMPLATE" false
