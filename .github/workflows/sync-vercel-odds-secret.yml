name: Sync odds secret to Vercel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      API_KEY_API_FOOTBALL: ${{ secrets.API_KEY_API_FOOTBALL }}
      API_FOOTBALL_BASE_URL: ${{ vars.API_FOOTBALL_BASE_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Validate required secrets
        run: |
          test -n "$ODDS_API_KEY" || (echo "ODDS_API_KEY ontbreekt" && exit 1)
          test -n "$VERCEL_TOKEN" || (echo "VERCEL_TOKEN ontbreekt" && exit 1)
      - name: Link Vercel project
        run: npx vercel@54.15.0 link --yes --project voetbalvoorspellingen-clean --scope nickpyamans-projects --token "$VERCEL_TOKEN"
      - name: Add ODDS_API_KEY to all Vercel environments
        run: |
          printf '%s' "$ODDS_API_KEY" | npx vercel@54.15.0 env add ODDS_API_KEY production --force --sensitive --yes --token "$VERCEL_TOKEN"
          printf '%s' "$ODDS_API_KEY" | npx vercel@54.15.0 env add ODDS_API_KEY preview "" --force --sensitive --yes --token "$VERCEL_TOKEN"
          printf '%s' "$ODDS_API_KEY" | npx vercel@54.15.0 env add ODDS_API_KEY development --force --yes --token "$VERCEL_TOKEN"
      - name: Add API-Football base URL to all Vercel environments
        if: env.API_FOOTBALL_BASE_URL != ''
        run: |
          printf '%s' "$API_FOOTBALL_BASE_URL" | npx vercel@54.15.0 env add API_FOOTBALL_BASE_URL production --force --yes --token "$VERCEL_TOKEN"
          printf '%s' "$API_FOOTBALL_BASE_URL" | npx vercel@54.15.0 env add API_FOOTBALL_BASE_URL preview "" --force --yes --token "$VERCEL_TOKEN"
          printf '%s' "$API_FOOTBALL_BASE_URL" | npx vercel@54.15.0 env add API_FOOTBALL_BASE_URL development --force --yes --token "$VERCEL_TOKEN"
      - name: Add API-Football key to all Vercel environments
        if: env.API_KEY_API_FOOTBALL != ''
        run: |
          printf '%s' "$API_KEY_API_FOOTBALL" | npx vercel@54.15.0 env add API_KEY_API_FOOTBALL production --force --sensitive --yes --token "$VERCEL_TOKEN"
          printf '%s' "$API_KEY_API_FOOTBALL" | npx vercel@54.15.0 env add API_KEY_API_FOOTBALL preview "" --force --sensitive --yes --token "$VERCEL_TOKEN"
          printf '%s' "$API_KEY_API_FOOTBALL" | npx vercel@54.15.0 env add API_KEY_API_FOOTBALL development --force --yes --token "$VERCEL_TOKEN"
