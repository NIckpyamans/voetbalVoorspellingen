name: Sync odds secret to Vercel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Validate required secrets
        run: |
          test -n "$ODDS_API_KEY" || (echo "ODDS_API_KEY ontbreekt" && exit 1)
          test -n "$VERCEL_TOKEN" || (echo "VERCEL_TOKEN ontbreekt" && exit 1)
      - name: Link Vercel project
        run: npx vercel@54.15.0 link --yes --project voetbalvoorspellingen-clean --scope nickpyamans-projects --token "$VERCEL_TOKEN"
      - name: Add ODDS_API_KEY to all Vercel environments
        run: |
          for target in production preview development; do
            printf '%s' "$ODDS_API_KEY" | npx vercel@54.15.0 env add ODDS_API_KEY "$target" --force --sensitive --yes --token "$VERCEL_TOKEN"
          done
