name: Provider Quota Audit

on:
  workflow_dispatch:
    inputs:
      probe_odds:
        description: "Voer een betaalde WK-oddsprobe van maximaal 1 credit uit"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit provider keys and quotas
        run: npm run monitor:provider-quotas
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          API_KEY_API_FOOTBALL: ${{ secrets.API_KEY_API_FOOTBALL }}
          API_KEY_FOOTBALL_DATA: ${{ secrets.API_KEY_FOOTBALL_DATA }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
          MYSPORTS_API_KEY: ${{ secrets.MYSPORTS_API_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          ODDS_PROBE: ${{ inputs.probe_odds || 'false' }}
