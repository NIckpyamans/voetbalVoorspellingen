name: Provider Quota Audit

on:
  workflow_dispatch:
    inputs:
      probe_odds:
        description: "Voer een betaalde WK-oddsprobe van maximaal 1 credit uit"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/step3b-layout
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit provider keys and quotas
        run: npm run monitor:provider-quotas
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          API_KEY_API_FOOTBALL: ${{ secrets.API_KEY_API_FOOTBALL }}
          API_KEY_FOOTBALL_DATA: ${{ secrets.API_KEY_FOOTBALL_DATA }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
          MYSPORTS_API_KEY: ${{ secrets.MYSPORTS_API_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          ODDS_PROBE: ${{ inputs.probe_odds || 'false' }}
      - name: Upload provider quota evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-quota-audit
          path: monitor/provider-quota-audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Persist compact provider status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add monitor/provider-quota-audit.json
          git diff --cached --quiet && exit 0
          git commit -m "update provider quota status [skip vercel]"
          if ! git pull --rebase origin codex/step3b-layout; then
            git rebase --abort || true
            echo "::warning::Providerstatus kon niet automatisch worden rebased."
            exit 0
          fi
          if ! git push origin HEAD:codex/step3b-layout; then
            echo "::warning::Providerstatus kon niet worden gepusht; het artifact blijft beschikbaar."
          fi
