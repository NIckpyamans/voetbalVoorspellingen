name: Pre-kickoff lineup refresh

on:
  workflow_dispatch:
    inputs:
      lookahead_minutes:
        description: "Zoekvenster; automatische captures vallen in T-75, T-45 en T-20"
        required: false
        default: "90"

concurrency:
  group: football-lineup-refresh
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

env:
  TZ: Europe/Amsterdam
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DATA_BRANCH: codex/step3b-layout
  FOOTYAI_DATE_WINDOW: today,tomorrow,+2
  API_KEY_FOOTBALL_DATA: ${{ secrets.API_KEY_FOOTBALL_DATA }}
  API_KEY_API_FOOTBALL: ${{ secrets.API_KEY_API_FOOTBALL }}
  APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
  GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
  API_GOAL: ${{ secrets.API_GOAL }}
  API_FOOTBALL_BASE_URL: ${{ vars.API_FOOTBALL_BASE_URL }}
  API_FOOTBALL_H2H_ENABLED: "false"
  SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY || secrets.MYSPORTS_API_KEY }}
  ODDS_FETCH_ENABLED: "false"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
  CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
  CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
  CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
  CLOUDFLARE_R2_PREFIX: ${{ secrets.CLOUDFLARE_R2_PREFIX }}
  R2_CRITICAL_CAPTURE_ENABLED: "true"

jobs:
  refresh-lineups:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.DATA_BRANCH }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh near-kickoff lineups
        timeout-minutes: 8
        run: node scripts/ci-neon-safe.js -- npm run db:lineups:prematch:collect
        env:
          LINEUP_LOOKAHEAD_MINUTES: ${{ inputs.lookahead_minutes || '90' }}
          LINEUP_CAPTURE_WINDOWS_ONLY: "true"
          LINEUP_PROVIDER_MAX_MATCHES: 16
          FOTMOB_LINEUP_ENABLED: "true"

      - name: Monitor lineup coverage
        run: node scripts/ci-neon-safe.js -- npm run monitor:lineups
        env:
          LINEUP_MONITOR_DAYS_AHEAD: 3
          LINEUP_MONITOR_LIMIT: 40

      - name: Report local data changes
        run: |
          git status --short data training monitor || true
          echo "Pre-kickoff refresh schrijft alleen critical captures naar R2/Neon. De kalender verwerkt deze zonder volledige worker-run."

      - name: Upload lineup capture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-kickoff-lineup-capture
          path: monitor/pre-kickoff-lineup-collector.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Persist compact lineup evidence
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          for report in monitor/pre-kickoff-lineup-collector.json monitor/lineup-availability-monitor.json; do
            if [ -f "$report" ]; then git add "$report"; fi
          done
          git diff --staged --quiet && exit 0
          git commit -m "update lineup coverage evidence [skip vercel]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$DATA_BRANCH"
            if git push origin "HEAD:$DATA_BRANCH"; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Rebuild predictions after confirmed lineup capture
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONFIRMED=$(node -e "const fs=require('fs');try{const r=JSON.parse(fs.readFileSync('monitor/pre-kickoff-lineup-collector.json','utf8'));process.stdout.write(String(Number(r.confirmed||0)))}catch{process.stdout.write('0')}")
          if [ "$CONFIRMED" -gt 0 ]; then
            echo "Confirmed lineup gevonden; voorspellingen opnieuw opbouwen."
            gh workflow run worker.yml --ref "$DATA_BRANCH"
          else
            echo "Geen nieuwe confirmed lineup; geen zware herberekening nodig."
          fi
