name: API-Football Pro Acceptance

on:
  workflow_dispatch:
    inputs:
      strict:
        description: "Alleen handmatig aanzetten om onvoldoende externe providerdekking als fout te behandelen"
        required: false
        default: "false"

permissions:
  actions: write
  contents: write

jobs:
  verify-pro-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_KEY_API_FOOTBALL: ${{ secrets.API_KEY_API_FOOTBALL }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
      API_FOOTBALL_BASE_URL: ${{ vars.API_FOOTBALL_BASE_URL }}
      API_FOOTBALL_ACCEPTANCE_DAYS_AHEAD: "8"
      API_FOOTBALL_ACCEPTANCE_LIMIT: "80"
      API_FOOTBALL_QUALIFIER_TARGET: "0.80"
      API_FOOTBALL_FRIENDLY_TARGET: "0.60"
      API_FOOTBALL_ACCEPTANCE_STRICT: ${{ github.event_name == 'workflow_dispatch' && (inputs.strict || 'false') || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/step3b-layout
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: acceptance
        name: Verify UEFA qualifier and friendly coverage
        continue-on-error: true
        run: npm run provider:api-football:acceptance
      - id: state
        name: Read acceptance state
        if: always()
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('monitor/api-football-provider-acceptance.json','utf8'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'accepted='+(p.accepted===true)+'\n');"
      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-football-provider-acceptance
          path: monitor/api-football-provider-acceptance.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Persist provider health report
        if: always()
        run: |
          test -f monitor/api-football-provider-acceptance.json || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add monitor/api-football-provider-acceptance.json
          test ! -f data/api-football-fixture-cache.json || git add data/api-football-fixture-cache.json
          git diff --cached --quiet && exit 0
          git commit -m "update api-football acceptance [skip vercel]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin codex/step3b-layout
            if git push origin HEAD:codex/step3b-layout; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Dispatch accepted provider recovery chain
        if: steps.state.outputs.accepted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run api-football-coverage-scout.yml --ref codex/step3b-layout
          gh workflow run pre-kickoff-lineups.yml --ref codex/step3b-layout
          gh workflow run free-prematch-odds.yml --ref codex/step3b-layout
          gh workflow run storage-recovery.yml --ref codex/step3b-layout
      - name: Enforce requested strict gate
        if: github.event_name == 'workflow_dispatch' && inputs.strict == 'true' && steps.acceptance.outcome == 'failure'
        run: exit 1
