name: Preseason friendly discovery

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: football-data-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Amsterdam
      DATA_BRANCH: codex/step3b-layout
      FOOTYAI_REFRESH_MODE: friendlies-discovery
      FOOTYAI_DATE_WINDOW: 0..75
      API_FOOTBALL_H2H_ENABLED: "false"
      ODDS_FETCH_ENABLED: "false"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/step3b-layout
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync followed club team IDs
        run: node scripts/sync-friendly-team-sources.js
      - name: Discover and predict friendlies
        run: node scripts/server-worker.js
      - name: Commit friendly fixtures
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add config/friendly-team-sources.json data training monitor
          git diff --staged --quiet && echo "geen wijzigingen" && exit 0
          git commit -m "update oefenwedstrijden [skip vercel]"
          git pull --rebase --autostash origin codex/step3b-layout
          git push origin HEAD:codex/step3b-layout
