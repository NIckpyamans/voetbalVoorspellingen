name: Upcoming team form enrichment

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

concurrency:
  group: football-form-enrichment
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  enrich-form:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATA_BRANCH: codex/step3b-layout
      FORM_ENRICHMENT_DAYS_AHEAD: "8"
      FORM_ENRICHMENT_MAX_TEAMS: "60"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.DATA_BRANCH }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run enrich:form:upcoming
      - name: Commit form cache
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/team-form-cache.json monitor/upcoming-team-form-enrichment.json
          git diff --staged --quiet && exit 0
          git commit -m "refresh upcoming team form cache [skip vercel]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$DATA_BRANCH"
            if git push origin HEAD:"$DATA_BRANCH"; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
