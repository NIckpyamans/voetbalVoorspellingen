name: Upcoming team form enrichment

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */3 * * *"

concurrency:
  group: football-form-enrichment
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  enrich-form:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATA_BRANCH: codex/step3b-layout
      FORM_ENRICHMENT_DAYS_AHEAD: "8"
      FORM_ENRICHMENT_MAX_TEAMS: "24"
      FORM_ENRICHMENT_REQUEST_TIMEOUT_MS: "4000"
      FORM_ENRICHMENT_TEAM_TIMEOUT_MS: "7000"
      FORM_ENRICHMENT_RUN_BUDGET_MS: "180000"
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
      CLOUDFLARE_R2_PREFIX: ${{ secrets.CLOUDFLARE_R2_PREFIX }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.DATA_BRANCH }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run enrich:form:upcoming
      - name: Commit form cache
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/team-form-cache.json monitor/upcoming-team-form-enrichment.json
          git diff --staged --quiet && exit 0
          git commit -m "refresh upcoming team form cache [skip vercel]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$DATA_BRANCH"
            if git push origin HEAD:"$DATA_BRANCH"; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
