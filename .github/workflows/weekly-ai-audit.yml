name: weekly-ai-professional-audit

on:
  schedule:
    - cron: "45 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

env:
  FOOTYAI_BASE_URL: https://voorspellingenprive.vercel.app
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build professional AI audit
        run: node scripts/weekly-professional-audit.js

      - name: Commit audit
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add monitor/ai-professional-audit.json monitor/ai-professional-audit.md
          git diff --staged --quiet && echo "geen wijzigingen" && exit 0
          git commit -m "update weekly professional AI audit [skip vercel]"
          git pull --rebase origin "$BRANCH_NAME" || true
          git push origin "$BRANCH_NAME"
