name: Live Score Refresh

on:
  workflow_dispatch:

concurrency:
  group: football-data-refresh
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Europe/Amsterdam
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DATA_BRANCH: codex/step3b-layout
  FOOTYAI_REFRESH_MODE: live-results
  FOOTYAI_DATE_WINDOW: yesterday,today,tomorrow
  FOOTYAI_LIGHTWEIGHT_REFRESH: "true"
  API_KEY_FOOTBALL_DATA: ${{ secrets.API_KEY_FOOTBALL_DATA }}
  API_KEY_API_FOOTBALL: ${{ secrets.API_KEY_API_FOOTBALL }}
  # Bewaar het API-Football-dagquotum voor de volledige workers; live scores hebben geen nieuwe H2H nodig.
  API_FOOTBALL_H2H_ENABLED: "false"
  # Prematch odds worden in de volledige workers vastgelegd; dit voorkomt 12 dubbele odds-calls per dag.
  ODDS_FETCH_ENABLED: "false"
  ODDS_PROVIDER_NAME: ${{ secrets.ODDS_PROVIDER_NAME }}
  ODDS_API_SPORT: ${{ secrets.ODDS_API_SPORT }}
  ODDS_API_URL_TEMPLATE: ${{ secrets.ODDS_API_URL_TEMPLATE }}
  ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
  THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

jobs:
  refresh-live-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.DATA_BRANCH }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh scores and standings
        timeout-minutes: 8
        run: node scripts/ci-neon-safe.js -- node scripts/server-worker.js

      - name: Commit and push data only
        run: |
          BRANCH_NAME="${DATA_BRANCH:-${{ github.ref_name }}}"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data training monitor
          git diff --staged --quiet && echo "geen scorewijzigingen" && exit 0
          git commit -m "live score update [skip vercel]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$BRANCH_NAME"
            if git push origin HEAD:"$BRANCH_NAME"; then
              exit 0
            fi
            echo "Push poging $attempt mislukt; remote is waarschijnlijk net bijgewerkt. Opnieuw proberen..."
            sleep $((attempt * 5))
          done
          echo "Push mislukt na 3 pogingen"
          exit 1
