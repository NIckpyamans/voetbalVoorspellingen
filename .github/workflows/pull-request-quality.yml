name: Pull request quality

on:
  pull_request:
    branches: ["codex/step3b-layout"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:archive-retention
      - run: npm run monitor:repository-size
      - run: npm run monitor:regressions
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
