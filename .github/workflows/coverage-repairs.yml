name: Coverage repair worker

on:
  schedule:
    - cron: "11 */6 * * *"
  workflow_dispatch:

concurrency:
  group: coverage-repair-worker
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Process dashboard repair requests
        run: node scripts/ci-neon-safe.js -- node scripts/process-coverage-repairs.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          COVERAGE_REPAIR_BATCH_LIMIT: 10
