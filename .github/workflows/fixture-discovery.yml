name: Upcoming season fixture discovery

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

jobs:
  football-data-2627:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        league: [E0, E1, N1, N2, D1, SP1, I1, F1]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Maintain Neon storage budget before fixture import
        run: npm run db:neon-storage:maintain
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - name: Discover Football-Data 2026/2027 fixtures
        run: node scripts/import-free-sources.js --source=football-data --league=${{ matrix.league }} --season-folder=2627
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          FREE_SOURCE_IMPORT_LIMIT: 160

  openfootball-upcoming:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        league: [en.1, en.2, nl.1, de.1, es.1, it.1, fr.1]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Maintain Neon storage budget before fixture import
        run: npm run db:neon-storage:maintain
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - name: Discover OpenFootball upcoming fixtures
        run: node scripts/import-free-sources.js --source=openfootball --league=${{ matrix.league }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          FREE_SOURCE_IMPORT_LIMIT: 160

  finalize:
    needs: [football-data-2627, openfootball-upcoming]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Maintain Neon storage budget before canonical merges
        run: npm run db:neon-storage:maintain
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - run: node scripts/merge-source-competitions.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - run: node scripts/merge-source-clubs.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - run: node scripts/merge-canonical-fixtures.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - run: node scripts/reset-competition-seasons.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
