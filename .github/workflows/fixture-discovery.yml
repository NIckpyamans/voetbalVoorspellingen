name: Upcoming season fixture discovery

on:
  workflow_dispatch:

jobs:
  football-data-2627:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        league: [E0, E1, N1, N2, D1, SP1, I1, F1, F2, P1, P2, B1, B2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Discover Football-Data 2026/2027 fixtures
        run: node scripts/ci-neon-safe.js -- node scripts/import-free-sources.js --source=football-data --league=${{ matrix.league }} --season-folder=2627
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          FOOTBALL_DATA_FULL_SEASONS: "true"
          FREE_SOURCE_IMPORT_LIMIT: 600

  openfootball-upcoming:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        league: [en.1, en.2, nl.1, de.1, es.1, it.1, fr.1]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Discover OpenFootball upcoming fixtures
        run: node scripts/ci-neon-safe.js -- node scripts/import-free-sources.js --source=openfootball --league=${{ matrix.league }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          FREE_SOURCE_IMPORT_LIMIT: 300

  finalize:
    needs: [football-data-2627, openfootball-upcoming]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Neon storage before canonical merges
        run: node scripts/ci-neon-safe.js -- npm run monitor:neon-storage
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - run: node scripts/ci-neon-safe.js -- node scripts/merge-source-competitions.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - run: node scripts/ci-neon-safe.js -- node scripts/merge-source-clubs.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - run: node scripts/ci-neon-safe.js -- node scripts/merge-canonical-fixtures.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - run: node scripts/ci-neon-safe.js -- node scripts/reset-competition-seasons.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
