name: Sportmonks Fixture Mapping

on:
  schedule:
    - cron: "50 */4 * * *"
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "Aantal dagen vooruit om te mappen"
        required: false
        default: "8"

concurrency:
  group: sportmonks-fixture-mapping
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  map-upcoming-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATA_BRANCH: codex/step3b-layout
      SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY || secrets.MYSPORTS_API_KEY }}
      SPORTMONKS_MAPPING_DAYS_AHEAD: ${{ inputs.days_ahead || '8' }}
      SPORTMONKS_MAPPING_LIMIT: "80"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DATA_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Map league, season and fixture ids
        run: npm run map:sportmonks:upcoming
      - name: Upload fixture mapping report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportmonks-fixture-mapping
          path: monitor/sportmonks-fixture-mapping.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit changed mapping cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Het monitorrapport is al als artifact bewaard. Laat het nooit een cache-push blokkeren.
          git restore --worktree monitor/sportmonks-fixture-mapping.json 2>/dev/null || true
          git add data/sportmonks-fixture-cache.json
          git diff --cached --quiet && exit 0
          git commit -m "update Sportmonks fixture mapping [skip vercel]"
          if ! git pull --rebase origin "$DATA_BRANCH"; then
            echo "::warning::Cachecommit kon niet automatisch rebased worden; rapport blijft beschikbaar als artifact."
            git rebase --abort || true
            exit 0
          fi
          if ! git push origin "HEAD:$DATA_BRANCH"; then
            echo "::warning::Cachecommit kon niet worden gepusht; volgende run probeert opnieuw."
            exit 0
          fi
