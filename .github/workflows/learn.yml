name: FootyAI learning

on:
  workflow_dispatch:
  schedule:
    # Dagelijkse learning-export nadat de vroege worker klaar hoort te zijn.
    - cron: "37 6 * * *"

concurrency:
  group: football-data-refresh
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Europe/Amsterdam
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DATA_BRANCH: codex/step3b-layout
  FOOTYAI_DATE_WINDOW: yesterday,today,tomorrow,+2,+3,+4,+5,+6,+7
  FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
  FOOTBALL_DATA_TEAM_MAP: ${{ secrets.FOOTBALL_DATA_TEAM_MAP }}
  NATIONAL_ELO_FEED_URL: ${{ secrets.NATIONAL_ELO_FEED_URL }}
  ODDS_PROVIDER_NAME: ${{ secrets.ODDS_PROVIDER_NAME }}
  ODDS_API_SPORT: ${{ secrets.ODDS_API_SPORT }}
  ODDS_API_URL_TEMPLATE: ${{ secrets.ODDS_API_URL_TEMPLATE }}
  ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
  THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  TRAINING_DB_CONTEXT_LIMIT: "200"

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.DATA_BRANCH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh match data and reviews
        run: npm run worker:once

      - name: Prepare training export
        run: npm run train:prepare

      - name: Analyze snapshot database context
        run: npm run train:snapshot-context:analyze

      - name: Commit and push learning data
        run: |
          BRANCH_NAME="${DATA_BRANCH:-${{ github.ref_name }}}"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add server_data.json data training monitor/snapshot-db-context.json
          git diff --staged --quiet && echo "geen wijzigingen" && exit 0
          git commit -m "update learning data [skip vercel]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$BRANCH_NAME"
            if git push origin HEAD:"$BRANCH_NAME"; then
              exit 0
            fi
            echo "Push poging $attempt mislukt; remote is waarschijnlijk net bijgewerkt. Opnieuw proberen..."
            sleep $((attempt * 5))
          done
          echo "Push mislukt na 3 pogingen"
          exit 1
