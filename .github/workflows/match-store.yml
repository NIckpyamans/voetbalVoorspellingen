name: Match store

# Bouwt de compacte wedstrijdopslag (data/match-store.json + match-index.json) en
# de vaste rapporten (monitor/club-analysis.*, monitor/model-report.json).
# De store wordt gevoed vanuit de runtime-publicatie: de workflows die data/days
# en reviews produceren schrijven uitsluitend naar Neon/R2 (geen data/-commits),
# dus de triggers hieronder volgen die workflows plus een dagelijkse vangnetronde.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  workflow_run:
    workflows: ["Football AI Worker", "Prediction evaluation", "Post-match Enrichment", "Live Score Refresh"]
    types: [completed]
  push:
    branches: ["codex/step3b-layout"]
    paths:
      - "data/days/**"
      - "data/history-summary.json"
      - "shared/matchStore.js"
      - "shared/modelMetrics.js"
      - "shared/marketBenchmark.js"
      - "shared/marketOdds.js"
      - "shared/clubStrength.js"
      - "shared/calibrationFit.js"
      - "shared/oddsFreshness.js"
      - "shared/matchStoreIntegrity.js"
      - "shared/matchStoreRemote.js"
      - "shared/ensembleWeightPolicy.js"
      - "shared/ensembleWeightFit.js"
      - "shared/modelHealth.js"
      - "scripts/build-match-store.js"
      - "scripts/verify-match-store.js"
      - "scripts/publish-match-store.js"
      - "scripts/fit-market-weight.js"
      - "scripts/build-market-odds.js"
      - "scripts/model-report.js"
      - "scripts/club-analysis.js"
      - "scripts/backtest-strength-model.js"
      - "data/market-odds.json"

permissions:
  contents: write

concurrency:
  group: match-store
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Alleen geslaagde runtime-runs leveren bruikbare data op.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
      CLOUDFLARE_R2_PREFIX: ${{ secrets.CLOUDFLARE_R2_PREFIX }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Refresh day data and reviews from runtime storage (Neon/R2)
        continue-on-error: true
        run: npm run db:predictions:materialize-reviews
      - name: Refresh market odds from football-data.co.uk (wekelijkse drempel)
        continue-on-error: true
        run: node scripts/build-market-odds.js
      - name: Build compact match store
        run: node scripts/build-match-store.js
      # Poort: de opslag moet bij de brondata horen en schoon zijn. Anders
      # rapporteren de analyses over een historie die niet meer bestaat.
      - name: Verify compact match store against its sources
        run: node scripts/verify-match-store.js
      - name: Build club analysis
        run: node scripts/club-analysis.js
      - name: Build model report
        run: node scripts/model-report.js
      # Meet het marktgewicht op de eigen historie (chronologisch train/holdout).
      # Geen poort: zonder genoeg gekoppelde duels slaat de meting over.
      - name: Fit market weight on own history
        continue-on-error: true
        run: node scripts/fit-market-weight.js
      # Walk-forward meting van de clubsterktes plus een sweep van de
      # Dixon-Coles-rho. Geen poort: een slechtere meting blokkeert de opslag niet.
      - name: Backtest strength model and rho sweep
        continue-on-error: true
        run: node scripts/backtest-strength-model.js
      # Dezelfde historie die de analyses gebruiken, nu ook als R2-object voor
      # de live worker. Zonder R2-secrets slaat het script over.
      - name: Publish compact match store to R2
        continue-on-error: true
        run: node scripts/publish-match-store.js
      - name: Commit match store and reports
        run: |
          git add data/match-store.json data/match-index.json data/market-odds.json monitor/club-analysis.md monitor/club-analysis.json monitor/model-report.json
          # De monitor-rapporten vallen onder de ignore-regel `monitor/*.json`.
          # Deze workflow hoort ze bewust te verspreiden, dus forceer ze en voeg
          # ze alleen toe wanneer het desbetreffende script ze ook echt schreef.
          if [ -f monitor/match-store-publish.json ]; then git add -f monitor/match-store-publish.json; fi
          if [ -f monitor/market-weight-fit.json ]; then git add monitor/market-weight-fit.json; fi
          # De backtest schrijft alleen bij genoeg wedstrijden een bestand.
          if [ -f monitor/strength-backtest.json ]; then git add monitor/strength-backtest.json; fi
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in de match-store of rapporten."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Vernieuw compacte match-store en rapporten [skip vercel]"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin "codex/step3b-layout"
              if git push origin "HEAD:codex/step3b-layout"; then exit 0; fi
              sleep $((attempt * 5))
            done
            exit 1
          fi
