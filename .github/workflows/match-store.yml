name: Match store

on:
  workflow_dispatch:
  push:
    branches: ["codex/step3b-layout"]
    paths:
      - "data/days/**"
      - "data/history-summary.json"
      - "shared/matchStore.js"
      - "scripts/build-match-store.js"

permissions:
  contents: write

concurrency:
  group: match-store
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build compact match store
        run: node scripts/build-match-store.js
      - name: Commit match store
        run: |
          git add data/match-store.json data/match-index.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in de match-store."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Vernieuw compacte match-store [skip vercel]"
            git push
          fi
