name: Free source database batches

on:
  schedule:
    - cron: "17 3 * * 2,5"
  workflow_dispatch:
    inputs:
      source:
        description: "Source to import: football-data, openfootball, statsbomb, venues, aliases, weather, all"
        required: false
        default: "football-data"
      league:
        description: "Optional league code, e.g. E0, E1, N1, D1, SP1"
        required: false
        default: ""
      season_folder:
        description: "Optional Football-Data season folder, e.g. 2526 or 2425"
        required: false
        default: ""

jobs:
  new-season-discovery:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        league: [E0, E1, N1, D1, SP1, I1, F1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Detect newly published season files
        run: node scripts/import-free-sources.js --source=football-data --league=${{ matrix.league }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          FREE_SOURCE_IMPORT_LIMIT: 120

  openfootball-season-discovery:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        league: [en.1, en.2, nl.1, de.1, es.1, it.1, fr.1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Detect newly published OpenFootball seasons
        run: node scripts/import-free-sources.js --source=openfootball --league=${{ matrix.league }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          FREE_SOURCE_IMPORT_LIMIT: 120

  season-discovery-finalize:
    if: github.event_name == 'schedule'
    needs: [new-season-discovery, openfootball-season-discovery]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Merge source competitions into canonical seasons
        run: node scripts/merge-source-competitions.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - name: Merge source clubs into canonical identities
        run: node scripts/merge-source-clubs.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - name: Merge duplicate source fixtures
        run: node scripts/merge-canonical-fixtures.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - name: Rebuild season memberships and H2H after discovery
        run: node scripts/reset-competition-seasons.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - name: Backfill free match stats and historical odds
        run: node scripts/import-free-sources.js --source=football-data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          FREE_SOURCE_IMPORT_LIMIT: 700
      - name: Backfill weather after season discovery
        run: node scripts/import-free-sources.js --source=weather
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          FREE_SOURCE_WEATHER_LIMIT: 700
      - name: Process requested coverage repairs
        run: node scripts/process-coverage-repairs.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          COVERAGE_REPAIR_BATCH_LIMIT: 12

  football-data:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        league: [E0, E1, N1, D1, SP1, I1, F1]
        season_folder: [2526, 2425]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-database-schema.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - run: node scripts/import-free-sources.js --source=football-data --league=${{ matrix.league }} --season-folder=${{ matrix.season_folder }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          FREE_SOURCE_IMPORT_LIMIT: 420
      - run: node scripts/reset-competition-seasons.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}

  statsbomb-xg:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import reliable free StatsBomb xG and style data
        run: node scripts/import-free-sources.js --source=statsbomb
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          STATSBOMB_EVENT_LIMIT: 80
          STATSBOMB_COMPETITION_LIMIT: 24
      - name: Canonicalize imported club identities
        run: node scripts/merge-source-clubs.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - name: Rebuild H2H after club canonicalization
        run: node scripts/reset-competition-seasons.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}

  manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-database-schema.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - run: node scripts/import-free-sources.js --source=${{ inputs.source }} --league=${{ inputs.league }} --season-folder=${{ inputs.season_folder }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          FREE_SOURCE_IMPORT_LIMIT: 420
          FREE_SOURCE_WEATHER_LIMIT: 250
          STATSBOMB_EVENT_LIMIT: 24
          STATSBOMB_COMPETITION_LIMIT: 16
          VENUE_GEOCODE_LIMIT: 20
      - run: node scripts/reset-competition-seasons.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
