name: Football AI Worker

on:
  workflow_dispatch:

concurrency:
  group: football-data-refresh
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Europe/Amsterdam
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DATA_BRANCH: codex/step3b-layout
  # De losse vorm-, H2H-, odds- en lineup-jobs verrijken verder vooruit.
  # De zware hoofdworker houdt het operationele weekvenster compact.
  FOOTYAI_DATE_WINDOW: yesterday,today,tomorrow,+2,+3,+4,+5,+6,+7
  FOOTYAI_LIGHTWEIGHT_REFRESH: "true"
  FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
  API_KEY_FOOTBALL_DATA: ${{ secrets.API_KEY_FOOTBALL_DATA }}
  FOOTBALL_DATA_TEAM_MAP: ${{ secrets.FOOTBALL_DATA_TEAM_MAP }}
  API_KEY_API_FOOTBALL: ${{ secrets.API_KEY_API_FOOTBALL }}
  APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
  GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
  API_FOOTBALL_BASE_URL: ${{ vars.API_FOOTBALL_BASE_URL }}
  # H2H wordt direct voor de worker door de gerichte backfill bijgewerkt.
  API_FOOTBALL_H2H_ENABLED: "false"
  API_FOOTBALL_MAX_FETCHES_PER_RUN: "10"
  # Opening/closing odds hebben een eigen quota-bewuste workflow.
  ODDS_FETCH_ENABLED: "false"
  NATIONAL_ELO_FEED_URL: ${{ secrets.NATIONAL_ELO_FEED_URL }}
  ODDS_PROVIDER_NAME: ${{ secrets.ODDS_PROVIDER_NAME }}
  ODDS_API_SPORT: ${{ secrets.ODDS_API_SPORT }}
  ODDS_API_URL_TEMPLATE: ${{ secrets.ODDS_API_URL_TEMPLATE }}
  ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
  THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
  ODDS_PROVIDER_NAME_2: ${{ secrets.ODDS_PROVIDER_NAME_2 }}
  ODDS_API_URL_TEMPLATE_2: ${{ secrets.ODDS_API_URL_TEMPLATE_2 }}
  ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
  ODDS_PROVIDER_NAME_3: ${{ secrets.ODDS_PROVIDER_NAME_3 }}
  ODDS_API_URL_TEMPLATE_3: ${{ secrets.ODDS_API_URL_TEMPLATE_3 }}
  ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
  SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
  MYSPORTS_API_KEY: ${{ secrets.MYSPORTS_API_KEY }}
  SPORTMONKS_ODDS_API_URL_TEMPLATE: ${{ secrets.SPORTMONKS_ODDS_API_URL_TEMPLATE }}
  ODDS_API_EXTRA_SPORTS: soccer_uefa_champs_league_qualification,soccer_uefa_europa_league_qualification,soccer_uefa_europa_conference_league_qualification,soccer_uefa_champs_league,soccer_uefa_europa_league,soccer_uefa_europa_conference_league
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
  CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
  CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
  CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
  CLOUDFLARE_R2_PREFIX: ${{ secrets.CLOUDFLARE_R2_PREFIX }}
  R2_CRITICAL_CAPTURE_ENABLED: "true"

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.DATA_BRANCH }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database schema
        run: node scripts/ci-neon-safe.js -- npm run db:schema:apply

      - name: Backfill upcoming club H2H to R2 and Neon when available
        run: npm run db:h2h:backfill-upcoming
        env:
          API_FOOTBALL_MAX_FETCHES_PER_RUN: "8"
          H2H_BACKFILL_DAYS_AHEAD: "14"
          H2H_BACKFILL_LIMIT: "24"

      - name: Assemble cached enrichments and predictions
        # Providerverrijking draait in losse jobs. Deze stap combineert hun
        # caches met het weekvenster en publiceert de voorspellingen.
        timeout-minutes: 9
        run: node scripts/ci-neon-safe.js -- node scripts/server-worker.js

      - name: Audit active competitions and post-match completeness
        run: npm run monitor:competition-data-coverage

      - name: Commit and push data
        run: |
          BRANCH_NAME="${DATA_BRANCH:-${{ github.ref_name }}}"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data monitor
          git diff --staged --quiet && echo "geen wijzigingen" && exit 0
          git commit -m "update wedstrijden [skip vercel]"
          for attempt in 1 2 3; do
            if ! git pull --rebase --autostash -X theirs origin "$BRANCH_NAME"; then
              git rebase --abort || true
              echo "Rebase poging $attempt mislukt; schone retry volgt..."
              sleep $((attempt * 5))
              continue
            fi
            if git push origin HEAD:"$BRANCH_NAME"; then
              exit 0
            fi
            echo "Push poging $attempt mislukt; remote is waarschijnlijk net bijgewerkt. Opnieuw proberen..."
            sleep $((attempt * 5))
          done
          echo "Push mislukt na 3 pogingen"
          exit 1
