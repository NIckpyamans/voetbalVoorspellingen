name: Regression Assertions

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "package.json"
      - "package-lock.json"
      - "App.tsx"
      - "components/**"
      - "api/**"
      - "shared/**"
      - "scripts/**"
      - "data/**"
      - "public/sw.js"
      - "vercel.json"
      - ".github/workflows/regression-assertions.yml"

jobs:
  check-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run regression assertions
        run: npm run monitor:regressions
      - name: Verify standings integrity
        run: npm run monitor:standings-integrity
      - name: Run unit and provider contract tests
        run: npm run test:unit
      - name: Verify static export retention
        run: npm run test:archive-retention
      - name: Enforce repository size budget
        run: npm run monitor:repository-size
