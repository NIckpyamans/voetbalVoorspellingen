name: Football AI Live Refresh

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: football-data-refresh
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Europe/Amsterdam
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  FOOTYAI_REFRESH_MODE: live

jobs:
  refresh-live-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh live scores and finished results
        run: node scripts/server-worker.js

      - name: Commit and push live data
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add server_data.json data
          git diff --staged --quiet && echo "geen live wijzigingen" && exit 0
          git commit -m "live scores verversen [skip vercel]"
          git pull --rebase origin "$BRANCH_NAME" || true
          git push origin "$BRANCH_NAME"
