name: Upcoming team squad enrichment

on:
  schedule:
    # Vier begrensde batches verminderen de achterstand zonder requestpieken.
    - cron: "17 3,8,13,18 * * *"
  workflow_dispatch:
    inputs:
      retry_unavailable:
        description: "Probeer alleen eerder missende selecties direct opnieuw via fallbacks"
        required: false
        type: boolean
        default: false
      force_refresh:
        description: "Vernieuw actuele selecties ook wanneer de cache-TTL nog niet verlopen is"
        required: false
        type: boolean
        default: false
      teams:
        description: "Optionele kommagescheiden clublijst voor een gerichte spoedcontrole"
        required: false
        type: string
        default: ""

concurrency:
  group: football-squad-enrichment
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  enrich-squads:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATA_BRANCH: codex/step3b-layout
      SQUAD_ENRICHMENT_DAYS_AHEAD: "8"
      # Een volledige batch blijft ruim binnen de workflow-timeout en werkt de
      # selectieachterstand ongeveer twee keer zo snel weg.
      SQUAD_ENRICHMENT_MAX_TEAMS: "32"
      SQUAD_ENRICHMENT_REQUEST_TIMEOUT_MS: "6000"
      SQUAD_ENRICHMENT_FORCE_UNAVAILABLE: ${{ inputs.retry_unavailable || 'false' }}
      SQUAD_ENRICHMENT_FORCE_REFRESH: ${{ inputs.force_refresh || 'false' }}
      SQUAD_ENRICHMENT_TEAM_FILTER: ${{ inputs.teams || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.DATA_BRANCH }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run enrich:squads:upcoming
      - name: Commit squad cache
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          for report in data/team-squad-cache.json monitor/upcoming-team-squad-enrichment.json; do
            if [ -f "$report" ]; then git add "$report"; fi
          done
          git diff --staged --quiet && exit 0
          git commit -m "refresh upcoming team squad cache [skip vercel]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$DATA_BRANCH"
            if git push origin HEAD:"$DATA_BRANCH"; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
