name: StatsBomb full xG backfill

on:
  schedule:
    - cron: "41 1 * * 0"
  workflow_dispatch:
    inputs:
      finalize_only:
        description: "Only finalize previously successful imports"
        type: boolean
        default: false
      reclaim_cache:
        description: "Archive and verify stale derived cache in R2 before finalization"
        type: boolean
        default: false

jobs:
  preflight:
    if: ${{ !inputs.finalize_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stop before imports when Neon has no headroom
        run: node scripts/manage-neon-storage.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}

  import-block:
    needs: preflight
    if: ${{ !inputs.finalize_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        offset: [0, 4, 8, 12, 16, 20, 24, 28, 32, 36, 40, 44, 48, 52, 56, 60, 64, 68, 72, 76]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import StatsBomb competition block
        run: node scripts/import-free-sources.js --source=statsbomb
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          STATSBOMB_COMPETITION_OFFSET: ${{ matrix.offset }}
          STATSBOMB_COMPETITION_LIMIT: 4
          STATSBOMB_EVENT_LIMIT: 1000

      - name: Preserve import result even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statsbomb-import-${{ matrix.offset }}
          path: monitor/free-source-import.json
          retention-days: 14

  finalize:
    needs: import-block
    timeout-minutes: 20
    if: ${{ always() && (needs.import-block.result == 'success' || inputs.finalize_only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Archive stale derived cache with verified R2 copy
        if: inputs.reclaim_cache
        run: node scripts/archive-stale-app-cache.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_PREFIX: ${{ secrets.CLOUDFLARE_R2_PREFIX }}
      - name: Check database headroom before any merge
        run: node scripts/manage-neon-storage.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - run: node scripts/merge-source-clubs.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - run: node scripts/repair-statsbomb-competitions.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - run: node scripts/merge-canonical-fixtures.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - run: node scripts/reset-competition-seasons.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
