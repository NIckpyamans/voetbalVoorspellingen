name: Free timestamped prematch odds

on:
  workflow_dispatch:

concurrency:
  group: football-prematch-odds
  cancel-in-progress: true

permissions:
  contents: write

env:
  DATA_BRANCH: codex/step3b-layout

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.DATA_BRANCH }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Neon availability once
        id: database
        run: npm run db:availability -- --emit-github-output
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - name: Capture critical odds to R2
        run: npm run db:odds:critical:r2
        env:
          ODDS_PROVIDER_NAME: ${{ secrets.ODDS_PROVIDER_NAME }}
          ODDS_API_URL_TEMPLATE: ${{ secrets.ODDS_API_URL_TEMPLATE }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDS_PROVIDER_NAME_2: ${{ secrets.ODDS_PROVIDER_NAME_2 }}
          ODDS_API_URL_TEMPLATE_2: ${{ secrets.ODDS_API_URL_TEMPLATE_2 }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_PROVIDER_NAME_3: ${{ secrets.ODDS_PROVIDER_NAME_3 }}
          ODDS_API_URL_TEMPLATE_3: ${{ secrets.ODDS_API_URL_TEMPLATE_3 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          API_KEY_API_FOOTBALL: ${{ secrets.API_KEY_API_FOOTBALL }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
          MYSPORTS_API_KEY: ${{ secrets.MYSPORTS_API_KEY }}
          SPORTMONKS_ODDS_API_URL_TEMPLATE: ${{ secrets.SPORTMONKS_ODDS_API_URL_TEMPLATE }}
          ODDS_API_EXTRA_SPORTS: soccer_uefa_champs_league_qualification,soccer_uefa_champs_league,soccer_uefa_europa_league,soccer_uefa_europa_conference_league,soccer_club_friendly,soccer_friendly
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_PREFIX: ${{ secrets.CLOUDFLARE_R2_PREFIX }}
          CRITICAL_ODDS_HOURS_AHEAD: 36
          CRITICAL_ODDS_MATCH_LIMIT: 40
          ODDS_API_MIN_REMAINING: 50
      - name: Persist prematch odds to Neon
        if: steps.database.outputs.available == 'true'
        run: node scripts/ci-neon-safe.js -- npm run db:odds:prematch:collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          ODDS_PROVIDER_NAME: ${{ secrets.ODDS_PROVIDER_NAME }}
          ODDS_API_URL_TEMPLATE: ${{ secrets.ODDS_API_URL_TEMPLATE }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDS_PROVIDER_NAME_2: ${{ secrets.ODDS_PROVIDER_NAME_2 }}
          ODDS_API_URL_TEMPLATE_2: ${{ secrets.ODDS_API_URL_TEMPLATE_2 }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_PROVIDER_NAME_3: ${{ secrets.ODDS_PROVIDER_NAME_3 }}
          ODDS_API_URL_TEMPLATE_3: ${{ secrets.ODDS_API_URL_TEMPLATE_3 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
          MYSPORTS_API_KEY: ${{ secrets.MYSPORTS_API_KEY }}
          SPORTMONKS_ODDS_API_URL_TEMPLATE: ${{ secrets.SPORTMONKS_ODDS_API_URL_TEMPLATE }}
          ODDS_API_EXTRA_SPORTS: soccer_uefa_champs_league_qualification,soccer_uefa_europa_league_qualification,soccer_uefa_europa_conference_league_qualification,soccer_uefa_champs_league,soccer_uefa_europa_league,soccer_uefa_europa_conference_league,soccer_club_friendly,soccer_friendly
          ODDS_API_MATCH_LIMIT: 180
          ODDS_API_DAYS_AHEAD: 28
          ODDS_API_CLOSING_LIMIT: 240
          ODDS_API_CLOSING_LOOKAHEAD_MINUTES: 240
          ODDS_API_MIN_REMAINING: 50
      - name: Enforce Neon odds leakage classifications
        if: steps.database.outputs.available == 'true'
        run: node scripts/ci-neon-safe.js -- npm run db:odds:leakage
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - name: Upload odds capture report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: critical-odds-capture
          path: monitor/critical-odds-capture.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Persist compact odds evidence
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          # Deze workflow bezit alleen odds-bewijs. Gedeelde database-status wordt
          # door storage-recovery beheerd om parallelle add/add-conflicten te voorkomen.
          for report in monitor/critical-odds-capture.json; do
            if [ -f "$report" ]; then git add "$report"; fi
          done
          git diff --staged --quiet && exit 0
          git commit -m "update timestamped odds evidence [skip vercel]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$DATA_BRANCH"
            if git push origin "HEAD:$DATA_BRANCH"; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
