name: Free timestamped prematch odds

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "13 */4 * * *"
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:odds:prematch:collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          ODDS_PROVIDER_NAME: ${{ secrets.ODDS_PROVIDER_NAME }}
          ODDS_API_URL_TEMPLATE: ${{ secrets.ODDS_API_URL_TEMPLATE }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDS_API_MATCH_LIMIT: 120
          ODDS_API_DAYS_AHEAD: 21
          ODDS_API_CLOSING_LIMIT: 180
          ODDS_API_CLOSING_LOOKAHEAD_MINUTES: 180
      - run: npm run db:odds:leakage
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
