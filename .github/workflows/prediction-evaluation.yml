name: Prediction evaluation

on:
  schedule:
    # Dagelijkse backstop nadat Europese avondwedstrijden en de nachtelijke
    # resultaatreparaties zijn afgerond.
    - cron: "40 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-data-refresh
  cancel-in-progress: false

env:
  DATA_BRANCH: codex/step3b-layout

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.DATA_BRANCH }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prove R2 snapshot write/read/evaluation
        run: npm run test:r2-snapshot-canary
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_PREFIX: ${{ secrets.CLOUDFLARE_R2_PREFIX }}
      - run: node scripts/ci-neon-safe.js -- npm run db:odds:prematch:collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          ODDS_PROVIDER_NAME: ${{ secrets.ODDS_PROVIDER_NAME }}
          ODDS_API_URL_TEMPLATE: ${{ secrets.ODDS_API_URL_TEMPLATE }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDS_PROVIDER_NAME_2: ${{ secrets.ODDS_PROVIDER_NAME_2 }}
          ODDS_API_URL_TEMPLATE_2: ${{ secrets.ODDS_API_URL_TEMPLATE_2 }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_PROVIDER_NAME_3: ${{ secrets.ODDS_PROVIDER_NAME_3 }}
          ODDS_API_URL_TEMPLATE_3: ${{ secrets.ODDS_API_URL_TEMPLATE_3 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
          MYSPORTS_API_KEY: ${{ secrets.MYSPORTS_API_KEY }}
          SPORTMONKS_ODDS_API_URL_TEMPLATE: ${{ secrets.SPORTMONKS_ODDS_API_URL_TEMPLATE }}
          ODDS_API_EXTRA_SPORTS: soccer_uefa_champs_league_qualification,soccer_uefa_europa_league_qualification,soccer_uefa_europa_conference_league_qualification,soccer_uefa_champs_league,soccer_uefa_europa_league,soccer_uefa_europa_conference_league
          ODDS_API_MATCH_LIMIT: 120
          ODDS_API_DAYS_AHEAD: 21
          ODDS_API_CLOSING_LIMIT: 180
          ODDS_API_CLOSING_LOOKAHEAD_MINUTES: 180
      - name: Evaluate immutable snapshots (Neon with R2 fallback)
        run: node scripts/evaluate-prediction-snapshots.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_PREFIX: ${{ secrets.CLOUDFLARE_R2_PREFIX }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          PREDICTION_EVALUATION_LIMIT: 5000
      - name: Recover immutable training set from evaluated R2 ledger
        run: |
          npm run db:predictions:materialize-reviews
          npm run train:snapshots:recover
          npm run train:prepare
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_PREFIX: ${{ secrets.CLOUDFLARE_R2_PREFIX }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-evaluation-report
          path: monitor/prediction-evaluation-report.json
          if-no-files-found: error
      - name: Upload R2 canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-snapshot-canary
          path: monitor/r2-snapshot-canary.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload recovered training evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-recovered-training
          path: |
            training/training-snapshot.json
            training/catboost-ready.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit immutable review links and training evidence
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          # Volledige trainingsexports staan al als artifact en in R2. Commit
          # alleen reviewlinks en compacte rapportage, zodat elke evaluatierun
          # de Git-repository niet opnieuw laat groeien.
          git add data/days data/history-summary.json monitor/prediction-evaluation-report.json monitor/snapshot-review-linking.json
          git diff --staged --quiet && echo "geen evaluatiewijzigingen" && exit 0
          git commit -m "link immutable prediction reviews [skip vercel]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$DATA_BRANCH"
            if git push origin HEAD:"$DATA_BRANCH"; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
      - run: node scripts/ci-neon-safe.js -- bash -lc "npm run db:roi-clv:analyze && npm run db:integrity:snapshot"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
