name: Nightly model maintenance

on:
  workflow_dispatch:
    inputs:
      apply_live:
        description: "Promoveer alleen reeds geaccepteerde profielen; standaard blijft shadow-only"
        required: false
        type: boolean
        default: false

concurrency:
  group: nightly-model-maintenance
  cancel-in-progress: false

permissions:
  contents: write

env:
  DATA_BRANCH: codex/step3b-layout

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MODEL_RECALIBRATION_MIN_ROWS: "20"
      MODEL_RECALIBRATION_MIN_VALIDATION_ROWS: "8"
      MODEL_RECALIBRATION_MIN_BRIER_IMPROVEMENT: "0.001"
      MODEL_RECALIBRATION_MIN_UNIQUE_COMPLETED_SNAPSHOTS: "50"
      MODEL_PROMOTION_MIN_UNIQUE_COMPLETED_SNAPSHOTS: "150"
      LOGO_BACKFILL_LIMIT: "80"
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
      CLOUDFLARE_R2_PREFIX: ${{ secrets.CLOUDFLARE_R2_PREFIX }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.DATA_BRANCH }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Backfill generated logo fallbacks
        run: node scripts/ci-neon-safe.js -- npm run db:logos:backfill:apply

      - name: Recalibrate league/model profiles in shadow mode
        if: inputs.apply_live != true
        run: node scripts/ci-neon-safe.js -- bash -lc "npm run db:models:recalibrate && npm run db:models:shadow:evaluate"

      - name: Promote accepted profiles explicitly
        if: inputs.apply_live == true
        run: node scripts/ci-neon-safe.js -- npm run db:models:recalibrate:apply

      - name: Monitor calibration sample health
        run: node scripts/ci-neon-safe.js -- npm run db:models:samples:monitor

      - name: Upload shadow calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-recalibration-report
          path: monitor/model-recalibration-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Persist compact calibration evidence
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          for report in monitor/model-recalibration-report.json monitor/calibration-sample-health.json monitor/shadow-prediction-evaluation.json monitor/ci-neon-soft-skips.json; do
            if [ -f "$report" ]; then git add "$report"; fi
          done
          git diff --staged --quiet && exit 0
          git commit -m "update shadow calibration evidence [skip vercel]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$DATA_BRANCH"
            if git push origin "HEAD:$DATA_BRANCH"; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
