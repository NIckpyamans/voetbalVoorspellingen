name: Post-match Enrichment

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: "Aantal recente dagen voor H2H-, vorm- en lineupbackfill"
        required: false
        default: "35"
  schedule:
    - cron: "37 2 * * *"

# Eigen groep; zie h2h-enrichment.yml: een gedeelde groep laat GitHub een
# nieuwe wachtende run de vorige verdringen.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Europe/Amsterdam
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DATA_BRANCH: codex/step3b-layout
  FOOTYAI_REFRESH_MODE: live-results
  FOOTYAI_DATE_WINDOW: -7..-1
  FOOTYAI_LIGHTWEIGHT_REFRESH: "true"
  RECENT_CONTEXT_DAYS_BACK: ${{ inputs.days_back || '35' }}
  RECENT_CONTEXT_LINEUP_LIMIT: "60"
  API_KEY_FOOTBALL_DATA: ${{ secrets.API_KEY_FOOTBALL_DATA }}
  API_KEY_API_FOOTBALL: ${{ secrets.API_KEY_API_FOOTBALL }}
  APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
  GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
  FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
  THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
  API_FOOTBALL_H2H_ENABLED: "false"
  ODDS_FETCH_ENABLED: "false"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
  CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
  CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
  CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
  CLOUDFLARE_R2_PREFIX: ${{ secrets.CLOUDFLARE_R2_PREFIX }}

jobs:
  enrich-completed-matches:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.DATA_BRANCH }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Backfill scores, incidents, cards, referee and match statistics
        timeout-minutes: 20
        run: node scripts/ci-neon-safe.js -- node scripts/server-worker.js
      - name: Backfill recent H2H, form and historical confirmed lineups
        timeout-minutes: 8
        run: npm run data:recent-context:backfill
      - name: Rebuild post-match quality audit
        run: npm run monitor:data-quality
      - name: Keep static day snapshots compact
        run: npm run data:days:compact
      - name: Commit enriched day data and audit
        # Deze stap faalde op 10-11-2026 in 2 seconden: `git pull --rebase` viel
        # met een conflict in een gegenereerd databestand om en door de impliciete
        # `bash -e` stopte de stap vóór de retry-lus iets kon doen. Daardoor bleef
        # alleen "Process completed with exit code 1" over. Een verse run is de
        # nieuwste bron van waarheid voor data/, dus een conflict wordt op onze
        # versie beslecht (-X theirs), een mislukte pull wordt geret in plaats van
        # de stap te killen, en de laatste foutregel gaat als annotatie naar de run.
        run: |
          BRANCH_NAME="${DATA_BRANCH:-${{ github.ref_name }}}"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data
          # monitor/*.json staat in .gitignore en de audits schrijven niet elk
          # rapport elke run. Forceer daarom alleen bestaande, expliciete paden;
          # een `git add` op een ontbrekend of genegeerd pad liet de stap falen.
          for report in monitor/data-quality-audit.json monitor/data-quality-audit.md monitor/recent-match-context-backfill.json; do
            if [ -f "$report" ]; then git add -f "$report"; fi
          done
          if git diff --staged --quiet; then echo "geen post-matchwijzigingen"; exit 0; fi
          git commit -m "post-match enrichment [skip vercel]"
          last_error=""
          for attempt in 1 2 3; do
            if ! last_error=$(git pull --rebase --autostash -X theirs origin "$BRANCH_NAME" 2>&1); then
              git rebase --abort >/dev/null 2>&1 || true
              echo "$last_error"
              sleep "$((attempt * 5))"
              continue
            fi
            if last_error=$(git push origin "HEAD:$BRANCH_NAME" 2>&1); then exit 0; fi
            echo "$last_error"
            sleep "$((attempt * 5))"
          done
          echo "::error title=post-match commit faalde::$(printf '%s' "$last_error" | tr '\n' ' ' | cut -c1-1500)"
          exit 1
