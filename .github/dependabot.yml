version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: codex/step3b-layout
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    groups:
      npm-safe-updates:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: codex/step3b-layout
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    groups:
      actions-safe-updates:
        update-types:
          - minor
          - patch
